<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fichas de práctica · DeRose Method</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
.header{padding:20px 16px 12px;border-bottom:1px solid #1e1e1e}
.badge{font-size:11px;font-weight:600;color:#9b8ff0;background:#1a1730;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.header h1{font-size:21px;font-weight:700;color:#fff}
.header p{font-size:13px;color:#888;margin-top:2px}
.progress-wrap{margin:10px 0 0}
.progress-bar{height:3px;background:#1e1e1e;border-radius:2px}
.progress-fill{height:3px;background:#7C6AE8;border-radius:2px;transition:width .4s}
.progress-label{font-size:11px;color:#555;margin-top:4px;text-align:right}
.ficha-tabs{display:flex;overflow-x:auto;gap:6px;padding:12px 16px;border-bottom:1px solid #1e1e1e;scrollbar-width:none}
.ficha-tabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid #2a2a2a;background:transparent;color:#888;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.ftab.active{background:#7C6AE8;color:#fff;border-color:#7C6AE8}
.ftab.has-done{border-color:#1a1730;color:#9b8ff0}
.exercise-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #111;cursor:pointer;-webkit-tap-highlight-color:transparent}
.check-circle{width:26px;height:26px;border-radius:50%;border:1.5px solid #2a2a2a;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.check-circle.done{background:#7C6AE8;border-color:#7C6AE8}
.checkmark{display:none;width:12px;height:12px}
.check-circle.done .checkmark{display:block}
.ex-info{flex:1;min-width:0}
.ex-name{font-size:14px;color:#e0e0e0;line-height:1.3;transition:color .2s}
.ex-name.done{color:#444;text-decoration:line-through}
.ex-desc{font-size:12px;color:#555;margin-top:2px;line-height:1.3}
.ex-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ex-img{width:48px;height:48px;object-fit:contain;border-radius:6px;background:#111;cursor:zoom-in;filter:grayscale(1);flex-shrink:0}
.timer-btn{background:#1a1730;border:none;border-radius:10px;padding:9px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;gap:5px;min-width:76px;justify-content:center;transition:background .2s;flex-shrink:0}
.timer-btn:active{opacity:.8}
.timer-play{color:#9b8ff0;font-size:10px}
.timer-display{font-size:13px;font-weight:700;color:#9b8ff0;font-variant-numeric:tabular-nums}
.timer-btn.running{background:#2a1f5a}
.timer-btn.halfway .timer-display,.timer-btn.halfway .timer-play{color:#f0c040}
.timer-btn.finished .timer-display,.timer-btn.finished .timer-play{color:#1D9E75}
.audio-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #111}
.audio-link{display:flex;align-items:center;gap:10px;text-decoration:none;flex:1}
.audio-icon{width:36px;height:36px;border-radius:50%;background:#7C6AE8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-label{font-size:14px;color:#e0e0e0;font-weight:500}
.audio-sub{font-size:11px;color:#555;margin-top:1px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.93);z-index:1000;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lightbox img{max-width:88%;max-height:82vh;object-fit:contain;border-radius:8px;filter:grayscale(1)}
.lb-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:#222;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="header">
  <div class="badge">DeRose Method</div>
  <h1>Fichas de práctica</h1>
  <p>Rosario · Santiago Sánchez Montandon</p>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
    <div class="progress-label" id="plabel">0 / 0 completados</div>
  </div>
</div>
<div class="ficha-tabs">
  <div class="ftab active" onclick="selFicha('inicio')">Inicio del día</div>
  <div class="ftab" onclick="selFicha('30')">30'</div>
  <div class="ftab" onclick="selFicha('40')">40'</div>
  <div class="ftab" onclick="selFicha('45')">45'</div>
</div>
<div id="content"></div>
<div class="lightbox" id="lb" onclick="closeLb()">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
</div>

 {"name": "Concentración", "desc": "Visualizar y sostener la atención en la imagen de la luna llena", "time": 240, "img": null}]}};

let state={}, curFicha='inicio';
const timers={};

function key(f,i){return f+'-'+i;}
function toggle(f,i){
  const k=key(f,i);
  state[k]=!state[k];
  if(timers[k]){clearInterval(timers[k].iv);delete timers[k];}
  render();
}
function openLb(imgKey,e){if(e)e.stopPropagation();document.getElementById('lb-img').src=IMGS[imgKey];document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open');}
function fmtTime(s){const m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec;}

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function beep(freq,dur){try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(0.4,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);o.start(audioCtx.currentTime);o.stop(audioCtx.currentTime+dur);}catch(e){}}
function bellEnd(){beep(880,0.5);setTimeout(()=>beep(1100,0.4),300);}
function bellHalf(){beep(660,0.3);}

function startTimer(f,i,totalSecs,evt){
  if(evt)evt.stopPropagation();
  initAudio();
  const k=key(f,i);
  if(timers[k]){clearInterval(timers[k].iv);delete timers[k];updateTimerBtn(f,i,totalSecs);return;}
  timers[k]={remaining:totalSecs,total:totalSecs,iv:null,halfDone:false};
  timers[k].iv=setInterval(()=>{
    timers[k].remaining--;
    const r=timers[k].remaining,half=Math.floor(timers[k].total/2);
    if(!timers[k].halfDone&&r===half){timers[k].halfDone=true;bellHalf();}
    if(r<=0){clearInterval(timers[k].iv);delete timers[k];bellEnd();state[k]=true;render();return;}
    updateTimerBtn(f,i,totalSecs);
  },1000);
  updateTimerBtn(f,i,totalSecs);
}

function updateTimerBtn(f,i,totalSecs){
  const k=key(f,i),btn=document.getElementById('tbtn-'+k);
  if(!btn)return;
  const t=timers[k],done=state[k];
  if(done){btn.className='timer-btn finished';btn.querySelector('.timer-display').textContent='✓';return;}
  if(!t){btn.className='timer-btn';btn.querySelector('.timer-display').textContent=fmtTime(totalSecs);return;}
  const half=t.remaining<=Math.floor(t.total/2);
  btn.className='timer-btn running'+(half?' halfway':'');
  btn.querySelector('.timer-display').textContent=fmtTime(t.remaining);
}

function updateProgress(){
  const exs=FICHAS[curFicha].exercises;
  let total=exs.length,done=0;
  exs.forEach((_,i)=>{if(state[key(curFicha,i)])done++;});
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('plabel').textContent=done+' / '+total+' completados';
}

function selFicha(f){
  curFicha=f;
  Object.keys(timers).forEach(k=>{clearInterval(timers[k].iv);delete timers[k];});
  document.querySelectorAll('.ftab').forEach((t,i)=>{t.classList.toggle('active',['inicio','30','40','45'][i]===f);});
  render();
}

function updateTabs(){
  document.querySelectorAll('.ftab').forEach((tab,i)=>{
    const f=['inicio','30','40','45'][i];
    let has=FICHAS[f].exercises.some((_,idx)=>state[key(f,idx)]);
    tab.classList.toggle('has-done',has&&f!==curFicha);
  });
}

function render(){
  updateTabs();
  const exs=FICHAS[curFicha].exercises;
  let html='';
  exs.forEach((ex,i)=>{
    const k=key(curFicha,i),done=state[k]||false;
    const t=timers[k],timeStr=done?'✓':(t?fmtTime(t.remaining):fmtTime(ex.time));
    const half=t&&t.remaining<=Math.floor(t.total/2);
    const btnClass='timer-btn'+(done?' finished':t?' running'+(half?' halfway':''):'');
    if(ex.audio){
      html+=`<div class="audio-item">
        <div class="check-circle ${done?'done':''}" onclick="toggle('${curFicha}',${i})"><svg class="checkmark" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 5,9.5 10.5,2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <a class="audio-link" href="https://youtu.be/JzFHis0Pd_Q" target="_blank">
          <div class="audio-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg></div>
          <div><div class="audio-label">${ex.name}</div><div class="audio-sub">${ex.desc||'Abrir en YouTube'}</div></div>
        </a>
      </div>`;
      return;
    }
    html+=`<div class="exercise-item" onclick="toggle('${curFicha}',${i})">
      <div class="check-circle ${done?'done':''}"><svg class="checkmark" viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 5,9.5 10.5,2.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ex-info">
        <div class="ex-name ${done?'done':''}">${ex.name}${ex.dual?' <span style="font-size:11px;color:#555">c/lado</span>':''}</div>
        ${ex.desc?`<div class="ex-desc">${ex.desc}</div>`:''}
      </div>
      <div class="ex-right">
        ${ex.img&&IMGS[ex.img]?`<img class="ex-img" src="${IMGS[ex.img]}" alt="${ex.name}" onclick="openLb('${ex.img}',event)" loading="lazy">`:''}
        <button id="tbtn-${k}" class="${btnClass}" onclick="startTimer('${curFicha}',${i},${ex.time},event)">
          <span class="timer-play">▶</span>
          <span class="timer-display">${timeStr}</span>
        </button>
      </div>
    </div>`;
  });
  document.getElementById('content').innerHTML=html;
  updateProgress();
}

render();
